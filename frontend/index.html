<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pdf_modifier_theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <style id="theme-preload-style">
      html[data-theme="dark"], html[data-theme="dark"] body {
        background-color: #0e0e10;
        color: #f2f2f5;
        color-scheme: dark;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #f8fafc;
        color: #0f172a;
        color-scheme: light;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>PDF Modifier — High-Fidelity PDF Edit Engine</title>
    <meta name="description" content="Direct in-place surgical PDF text modification without rasterization, flattening, or Word conversion." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
