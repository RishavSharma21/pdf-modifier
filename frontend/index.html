<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pdf_modifier_theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}

        // Global iOS Safari / WebKit Polyfills for PDF.js v6
        if (typeof Promise.withResolvers === 'undefined') {
          Promise.withResolvers = function() {
            var resolve, reject;
            var promise = new Promise(function(res, rej) { resolve = res; reject = rej; });
            return { promise: promise, resolve: resolve, reject: reject };
          };
        }
        if (typeof Map !== 'undefined' && typeof Map.prototype.getOrInsertComputed === 'undefined') {
          Map.prototype.getOrInsertComputed = function(key, fn) {
            if (this.has(key)) return this.get(key);
            var val = fn(key);
            this.set(key, val);
            return val;
          };
        }
        if (typeof Map !== 'undefined' && typeof Map.prototype.getOrInsert === 'undefined') {
          Map.prototype.getOrInsert = function(key, defVal) {
            if (this.has(key)) return this.get(key);
            this.set(key, defVal);
            return defVal;
          };
        }
        if (typeof URL !== 'undefined' && typeof URL.parse !== 'function') {
          URL.parse = function(url, base) {
            try { return new URL(url, base); } catch(e) { return null; }
          };
        }
      })();
    </script>
    <style id="theme-preload-style">
      html[data-theme="dark"], html[data-theme="dark"] body {
        background-color: #0e0e10;
        color: #f2f2f5;
        color-scheme: dark;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #f8fafc;
        color: #0f172a;
        color-scheme: light;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>PDF Modifier — High-Fidelity PDF Edit Engine</title>
    <meta name="description" content="Direct in-place surgical PDF text modification without rasterization, flattening, or Word conversion." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
