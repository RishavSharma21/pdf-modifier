<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Background Gradient: Electric Blue to Deep Royal -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Document Sheet Gradient -->
    <linearGradient id="favDoc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Folded Corner Flap Gradient -->
    <linearGradient id="favFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Accent Gradient for the Stylized "P" -->
    <linearGradient id="favP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Base (Apple/Linear App Icon Style) -->
  <rect width="32" height="32" rx="7.5" fill="url(#favBg)" />
  <rect
    x="0.5"
    y="0.5"
    width="31"
    height="31"
    rx="7"
    stroke="rgba(255, 255, 255, 0.35)"
    stroke-width="1"
    fill="none"
  />

  <!-- Crisp Folded Document Silhouette -->
  <g>
    <!-- Document Body -->
    <path
      d="M8.5 6C8.5 5.17157 9.17157 4.5 10 4.5H18.5L24 10V26C24 26.8284 23.3284 27.5 22.5 27.5H10C9.17157 27.5 8.5 26.8284 8.5 26V6Z"
      fill="url(#favDoc)"
    />

    <!-- Folded Corner Flap -->
    <path
      d="M18.5 4.5V9.5C18.5 9.77614 18.7239 10 19 10H24L18.5 4.5Z"
      fill="url(#favFold)"
    />
  </g>

  <!-- Bold Stylized Monogram "P" (Precision Vector Edit Motif) -->
  <!-- Vertical Stem -->
  <rect x="11.8" y="9.5" width="2.6" height="13" rx="1.3" fill="url(#favP)" />
  
  <!-- Upper Loop of the "P" -->
  <path
    d="M13 9.5H17.2C19.0778 9.5 20.6 11.0222 20.6 12.9C20.6 14.7778 19.0778 16.3 17.2 16.3H13V9.5Z"
    fill="url(#favP)"
  />
  <!-- Inner Loop Cutout -->
  <path
    d="M14.4 11.4H17C17.8284 11.4 18.5 12.0716 18.5 12.9C18.5 13.7284 17.8284 14.4 17 14.4H14.4V11.4Z"
    fill="#ffffff"
  />
</svg>