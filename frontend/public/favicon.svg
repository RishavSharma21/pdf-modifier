<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background Gradient: Deep Luxury Royal Indigo to Sapphire -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Document Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Folded Corner Flap Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Stylus / Vector Edit Accent Gradient -->
    <linearGradient id="stylusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="elevatedShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
    
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Elevated Squircle Container -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bgGrad)" />
  <rect x="2.5" y="2.5" width="43" height="43" rx="11.5" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1" fill="none" />

  <!-- Document & Vector Quill Geometry -->
  <g filter="url(#elevatedShadow)">
    <!-- Main Document Silhouette with folded top-right corner -->
    <path
      d="M13 10C13 8.89543 13.8954 8 15 8H27.5L35 15.5V36C35 37.1046 34.1046 38 33 38H15C13.8954 38 13 37.1046 13 36V10Z"
      fill="url(#pageGrad)"
    />

    <!-- Folded Corner Flap -->
    <path
      d="M27 8V14C27 14.5523 27.4477 15 28 15H35L27 8Z"
      fill="url(#foldGrad)"
      opacity="0.9"
    />
  </g>

  <!-- Vector Precision Edit Symbol: Stylized Monogram "P" / Vector Quill Node -->
  <g filter="url(#softGlow)">
    <!-- The "P" upper loop / Vector edit node -->
    <path
      d="M18 15H24C26.2091 15 28 16.7909 28 19C28 21.2091 26.2091 23 24 23H20.5V29C20.5 29.5523 20.0523 30 19.5 30H19C18.4477 30 18 29.5523 18 29V15Z"
      fill="url(#stylusGrad)"
    />
    
    <!-- Inner P counter / Vector anchor window -->
    <path
      d="M20.5 17.5V20.5H23.8C24.6284 20.5 25.3 19.8284 25.3 19C25.3 18.1716 24.6284 17.5 23.8 17.5H20.5Z"
      fill="#ffffff"
    />

    <!-- Vector Node Pulse Dot (indicating live precision vector editing) -->
    <circle cx="28" cy="29" r="2.2" fill="#0284c7" />
    <circle cx="28" cy="29" r="1.2" fill="#ffffff" />
    
    <!-- Editorial Edit Line Accent -->
    <path
      d="M23 29H25"
      stroke="#0284c7"
      stroke-width="1.5"
      stroke-linecap="round"
    />
  </g>
</svg>